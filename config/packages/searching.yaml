searching:
  enabled: true
  default_provider: null

  providers:
    "null":
      enabled: true

    elasticsearch:
      enabled: false
      dsn: '%env(default::SEARCHING_ELASTICSEARCH_DSN)%'
      index_prefix: 'sr'
      options:
        text_analyzer: standard
        keyword_normalizer: lowercase
        search_fields: ['title^4', 'summary^2', 'body', 'keywords^3']
        highlight_fields: ['title', 'summary', 'body']
        facet_fields: []
        synonym_boost: 0.75
        suggestion_fields: ['title^5', 'keywords^3', 'summary^2']
        suggestion_prefix_boost: 2.0
        suggestion_fuzzy_boost: 0.5
        suggestion_synonym_boost: 0.75

    opensearch:
      enabled: false
      dsn: '%env(default::SEARCHING_OPENSEARCH_DSN)%'
      index_prefix: 'sr'
      options:
        text_analyzer: standard
        keyword_normalizer: lowercase
        search_fields: ['title^4', 'summary^2', 'body', 'keywords^3']
        highlight_fields: ['title', 'summary', 'body']
        facet_fields: []
        suggestion_fields: ['title^5', 'keywords^3', 'summary^2']
        suggestion_prefix_boost: 2.0
        suggestion_fuzzy_boost: 0.5
        suggestion_synonym_boost: 0.75

  indexing:
    batch_size: 100
    track_document_hash: true
    reindex:
      # sync keeps local/dev safe; messenger queues large jobs when Messenger transport is configured.
      dispatch_mode: sync
      messenger_max_attempts: 3
      duplicate_guard: true

  query:
    default_limit: 20
    max_limit: 100
    highlights: true
    facets: true

  logging:
    enabled: false
    driver: 'null'
    flush_immediately: true
    recent_limit: 50

  security:
    permission_filtering: true

  flow_control:
    # Safe default: disabled uses NullSearchOperationLimiter.
    enabled: false
    default_mode: reject
    operations:
      search.query:
        limit: 120
        window_seconds: 60
        mode: reject
      search.reindex.dispatch:
        limit: 5
        window_seconds: 300
        mode: defer

# Result hydration keeps backend search results from becoming the final source of truth.
# Producer components may register searching.search_result_hydrator services to refresh/drop stale hits.
# searching:
#   hydration:
#     enabled: true
