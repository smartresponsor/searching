  controller: App\Searching\Controller\Api\SearchProviderStatusApiController::__invoke
  methods: [GET]

searching_api_query_logs:
  path: /api/search/query/log
  controller: App\Searching\Controller\Api\SearchQueryLogApiController::__invoke
  methods: [GET]

searching_api_reindex:
  path: /api/search/reindex
  controller: App\Searching\Controller\Api\SearchReindexApiController::__invoke
  methods: [POST]

