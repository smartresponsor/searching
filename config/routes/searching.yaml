searching_api_search:
  path: /api/search
  controller: App\Searching\Controller\Api\SearchApiController::__invoke
  methods: [GET]

searching_api_bridge_interfacing:
  path: /api/search/bridge/interfacing
  controller: App\Searching\Controller\Api\SearchBridgeApiController::interfacing
  methods: [GET]

searching_api_health:
  path: /api/search/health
  controller: App\Searching\Controller\Api\SearchHealthApiController::__invoke
  methods: [GET]

searching_api_resources:
  path: /api/search/resource
  controller: App\Searching\Controller\Api\SearchResourceApiController::__invoke
  methods: [GET]

searching_api_provider_status:
