searching_api_synonyms_update:
  path: /api/search/synonym/{id}
  controller: App\Searching\Controller\Api\SearchSynonymApiController::update
  requirements:
    id: \d+
  methods: [PATCH, PUT]

searching_api_synonyms_delete:
  path: /api/search/synonym/{id}
  controller: App\Searching\Controller\Api\SearchSynonymApiController::delete
  requirements:
    id: \d+
