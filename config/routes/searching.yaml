  path: /api/search/index/ensure
  controller: App\Searching\Controller\Api\SearchIndexLifecycleApiController::ensure
  methods: [POST]

searching_api_index_delete:
  path: /api/search/index/delete
  controller: App\Searching\Controller\Api\SearchIndexLifecycleApiController::delete
  methods: [POST]

searching_api_indexes:
  path: /api/search/index
  controller: App\Searching\Controller\Api\SearchIndexApiController::list
  methods: [GET]

searching_api_indexes_create:
  path: /api/search/index
  controller: App\Searching\Controller\Api\SearchIndexApiController::create
  methods: [POST]

searching_api_indexes_update:
  path: /api/search/index/{resourceType}
  controller: App\Searching\Controller\Api\SearchIndexApiController::update
  methods: [PATCH]

searching_api_indexes_delete:
  path: /api/search/index/{resourceType}
  controller: App\Searching\Controller\Api\SearchIndexApiController::delete
  methods: [DELETE]

searching_api_relevance_profiles_list:
  path: /api/search/relevance/profile
  controller: App\Searching\Controller\Api\SearchRelevanceProfileApiController::list
  methods: [GET]

searching_api_relevance_profiles_create:
  path: /api/search/relevance/profile
  controller: App\Searching\Controller\Api\SearchRelevanceProfileApiController::create
  methods: [POST]

searching_api_relevance_profiles_update:
  path: /api/search/relevance/profile/{id}
  controller: App\Searching\Controller\Api\SearchRelevanceProfileApiController::update
  requirements:
    id: \d+
  methods: [PATCH, PUT]

searching_api_relevance_profiles_delete:
  path: /api/search/relevance/profile/{id}
  controller: App\Searching\Controller\Api\SearchRelevanceProfileApiController::delete
  requirements:
    id: \d+
  methods: [DELETE]

searching_api_synonyms_list:
